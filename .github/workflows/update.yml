name: Update PR streaks

on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:
    inputs:
      refresh_registrations:
        description: 'Refresh next competitions (adds about 9 minutes)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WCA export
        run: curl -sSL --fail -o "$RUNNER_TEMP/export.zip" https://www.worldcubeassociation.org/export/results/v2/tsv

      - name: Build site
        run: |
          mkdir -p site/data history
          python3 build_streaks.py "$RUNNER_TEMP/export.zip" site/data history
          cp index.html site/index.html

      - name: Next competitions
        continue-on-error: true
        env:
          FULL: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_registrations }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data
          if [ "$FULL" != "true" ]; then
            ok=0
            if git fetch -q --depth 1 origin registrations-cache; then
              ok=1
              for f in next_comps comps registrations; do
                git show "FETCH_HEAD:$f.csv" > "site/data/$f.csv" || ok=0
              done
            fi
            if [ "$ok" = "1" ] && [ "$(wc -l < site/data/next_comps.csv)" -gt 100 ]; then
              echo "Reused the saved next competitions (from the registrations-cache branch)"
              exit 0
            fi
            rm -f site/data/next_comps.csv site/data/comps.csv site/data/registrations.csv
            echo "No saved copy found, doing a full refresh"
          fi
          python3 fetch_registrations.py site/data
          if [ "$(wc -l < site/data/next_comps.csv 2>/dev/null || echo 0)" -gt 100 ]; then
            d=$(mktemp -d)
            cp site/data/next_comps.csv site/data/comps.csv site/data/registrations.csv "$d/"
            (cd "$d" && git init -q -b cache && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com \
              && git add . && git commit -qm "Saved next competitions" \
              && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cache:registrations-cache) \
              && echo "Saved a copy for quick runs" || echo "Could not save a copy for quick runs"
          fi

      - name: Save history snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -r -q --ignore-unmatch data
          git add history
          git diff --cached --quiet || git commit -m "Update history"
          git pull --rebase -q origin main
          git push

      - name: Check the site folder
        run: |
          ls -la site site/data
          test "$(wc -c < site/data/people.csv)" -gt 1000000
          test -s site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for the upload to register
        run: sleep 15

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Check that the live site really has the data
        id: verify
        continue-on-error: true
        env:
          URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
        run: |
          base="${URL%/}/"
          want=$(wc -c < site/data/people.csv)
          for i in $(seq 1 10); do
            code=$(curl -s -o "$RUNNER_TEMP/live.csv" -w '%{http_code}' "${base}data/people.csv?v=$RANDOM$i" || true)
            got=$(wc -c < "$RUNNER_TEMP/live.csv")
            echo "try $i: HTTP $code, $got bytes (expected $want)"
            if [ "$code" = "200" ] && [ "$got" = "$want" ]; then echo "Live site is good"; exit 0; fi
            sleep 20
          done
          exit 1

      - name: Show what is deployed (only if the check failed)
        if: steps.verify.outcome == 'failure'
        run: |
          base="${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"
          base="${base%/}/"
          curl -sI "${base}" | head -12 || true
          curl -sI "${base}data/people.csv?v=$RANDOM" | head -12 || true
          git log --oneline -3 || true

      - name: Deploy again if the check failed
        id: deployment_fix
        if: steps.verify.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Final check (turns the run red if the site is still broken)
        if: steps.verify.outcome == 'failure'
        env:
          URL: ${{ steps.deployment_fix.outputs.page_url }}
        run: |
          sleep 30
          base="${URL%/}/"
          want=$(wc -c < site/data/people.csv)
          code=$(curl -s -o "$RUNNER_TEMP/live.csv" -w '%{http_code}' "${base}data/people.csv?v=$RANDOM" || true)
          got=$(wc -c < "$RUNNER_TEMP/live.csv")
          echo "HTTP $code, $got bytes (expected $want)"
          [ "$code" = "200" ] && [ "$got" = "$want" ]
