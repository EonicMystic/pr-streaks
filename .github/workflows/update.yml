name: Update PR streaks

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WCA export
        run: curl -sSL --fail -o "$RUNNER_TEMP/export.zip" https://www.worldcubeassociation.org/export/results/v2/tsv

      - name: Build site
        run: |
          mkdir -p site/data history
          python3 build_streaks.py "$RUNNER_TEMP/export.zip" site/data history
          cp index.html site/index.html

      - name: Upcoming registrations
        continue-on-error: true
        run: python3 fetch_registrations.py site/data

      - name: Save history snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -r -q --ignore-unmatch data
          git add history
          git diff --cached --quiet || git commit -m "Update history"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
