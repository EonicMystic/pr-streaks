name: Update PR streaks

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      refresh_registrations:
        description: 'Refresh next competitions (adds about 9 minutes)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WCA export
        run: curl -sSL --fail -o "$RUNNER_TEMP/export.zip" https://www.worldcubeassociation.org/export/results/v2/tsv

      - name: Build site
        run: |
          mkdir -p site/data history
          python3 build_streaks.py "$RUNNER_TEMP/export.zip" site/data history
          cp index.html site/index.html

      - name: Next competitions
        continue-on-error: true
        env:
          FULL: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_registrations }}
          LIVE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          if [ "$FULL" != "true" ]; then
            ok=1
            for f in next_comps comps registrations; do
              curl -sSL --fail --retry 4 --retry-delay 5 -o "site/data/$f.csv" "$LIVE_BASE/$f.csv" || ok=0
            done
            if [ "$ok" = "1" ] && [ "$(wc -l < site/data/next_comps.csv)" -gt 100 ]; then
              echo "Reused the next competitions already on the live site"
              exit 0
            fi
            rm -f site/data/next_comps.csv site/data/comps.csv site/data/registrations.csv
            echo "No usable live copy found, doing a full refresh"
          fi
          python3 fetch_registrations.py site/data

      - name: Save history snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -r -q --ignore-unmatch data
          git add history
          git diff --cached --quiet || git commit -m "Update history"
          git pull --rebase -q origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
